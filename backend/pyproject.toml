[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
# B008 flags "function call in default argument", which is exactly FastAPI's
# `db: Session = Depends(get_db)` on every endpoint.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]
