name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18.17.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      # The test suite runs on SQLite, so this is the only place the MySQL-only schema rules
      # (VARCHAR lengths, DATETIME(6)) are exercised.
      - run: docker compose run --rm backend python -m app.init_db
      - run: curl --fail --silent --show-error http://localhost:8000/health
      - run: curl --fail --silent --show-error http://localhost:3000/
      - name: Round-trip a bean through the frontend proxy
        run: |
          id=$(curl --fail --silent --show-error -X POST http://localhost:3000/api/beans \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Bean","roaster":"CI"}' | jq -e '.id')
          curl --fail --silent --show-error "http://localhost:3000/api/beans/$id" \
            | jq -e '.name == "CI Bean"'
      - if: failure()
        run: docker compose logs
